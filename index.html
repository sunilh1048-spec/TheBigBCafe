
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Big Bellyz | Digital Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fcfcfc;
            margin: 0;
            padding: 0;
        }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .bg-tan { background-color: #d4b499; }
        .text-tan { color: #d4b499; }
        .border-tan { border-color: #d4b499; }
        
        /* Custom Scrollbar Styling */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #d4b499;
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #c3a388;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Enhanced Feedback Animations */
        @keyframes item-pop {
            0% { transform: scale(1); background-color: #ffffff; box-shadow: none; border-color: #e5e7eb; }
            20% { transform: scale(1.05); background-color: #fffaf0; box-shadow: 0 20px 40px -10px rgba(212, 180, 153, 0.4); border-color: #d4b499; }
            80% { transform: scale(1.02); background-color: #fffaf0; box-shadow: 0 20px 40px -10px rgba(212, 180, 153, 0.2); border-color: #d4b499; }
            100% { transform: scale(1); background-color: #ffffff; box-shadow: none; border-color: #e5e7eb; }
        }
        .animate-item-pop {
            animation: item-pop 2.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            z-index: 10;
        }

        @keyframes cart-bounce {
            0% { transform: scale(1); }
            30% { transform: scale(1.04); }
            50% { transform: scale(0.98); }
            75% { transform: scale(1.01); }
            100% { transform: scale(1); }
        }
        .animate-cart-bounce {
            animation: cart-bounce 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* New Order Highlight */
        @keyframes new-order-glow {
            0% { box-shadow: 0 0 0 0 rgba(212, 180, 153, 0.4); border-color: #d4b499; }
            50% { box-shadow: 0 0 20px 5px rgba(212, 180, 153, 0.6); border-color: #d4b499; }
            100% { box-shadow: 0 0 0 0 rgba(212, 180, 153, 0.4); border-color: #d4b499; }
        }
        .animate-new-order {
            animation: new-order-glow 2s infinite ease-in-out;
        }
        
        @media print {
            @page {
                margin: 0;
                size: 80mm auto;
            }
            body {
                background: white !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            #root {
                display: none !important;
            }
            #receipt-print-zone {
                display: block !important;
                visibility: visible !important;
                width: 100% !important;
                padding: 10mm !important;
            }
            .no-print {
                display: none !important;
            }
        }
        
        #receipt-print-zone {
            display: none;
        }
    </style>
